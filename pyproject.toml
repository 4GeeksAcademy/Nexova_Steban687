[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexova-solutions"
version = "0.1.0"
description = "AI-powered HR Consulting & Talent Acquisition Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Nexova Solutions", email = "hello@nexova.com"},
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
demo = [
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = [
    "services*",
    "agents*",
]
namespaces = true

[tool.pytest.ini_options]
testpaths = [
    "services/selection",
    "agents/selection",
]
python_files = "test_*.py"